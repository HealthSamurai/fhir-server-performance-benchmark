global:
  scrape_interval: 10s
  scrape_timeout: 5s
  scrape_protocols:
  - PrometheusProto
  - PrometheusText0.0.4
  evaluation_interval: 10s
runtime:
  gogc: 75

scrape_configs:

  - job_name: aidbox
    static_configs:
      - targets: ["aidbox:8379"]

  - job_name: docker
    static_configs:
      - targets: ["host.docker.internal:9323"]

  - job_name: hapi
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["hapi:8080"]

  - job_name: intersystems
    metrics_path: /api/monitor/metrics
    static_configs:
      - targets: ["intersystems:52773"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: mssql
    static_configs:
      - targets: ["mssql-exporter:4000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    # cAdvisor turns every Docker image label into a container_label_* label. The
    # IRIS image carries 22 of them, which (with the labels CI adds at remote-write)
    # pushes its series past VictoriaMetrics' 40-labels-per-series limit, so
    # perf-intersystems CPU/memory never reached the dashboards. Drop the image
    # metadata labels; the com.docker.compose.* ones the dashboards use stay.
    metric_relabel_configs:
      - action: labeldrop
        regex: container_label_(com_intersystems_.+|org_opencontainers_.+|description|maintainer|name|release|summary|vendor|version)

  - job_name: medplum
    static_configs:
      - targets: ["otel-collector:8889"]
