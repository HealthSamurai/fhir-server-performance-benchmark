# Mounted over the IRIS private web server's conf/httpd-local.conf, which its
# httpd.conf includes last.
#
# Caps concurrent FHIR requests at 16, one per CPU of the container. By default
# the Web Gateway serves every in-flight request with its own IRIS process — ~375
# under 300 VUs, thrashing on 16 cores at half the throughput or less.
#
# The cap lives here rather than in the gateway's Maximum_Server_Connections:
# requests waiting in the gateway queue are woken unfairly, so under sustained
# load part of the initial burst starved until the client timeout (60s). Here they
# wait in the kernel accept queue, which is FIFO. That needs a single Apache
# process (gateway connections to IRIS belong to the process that opened them)
# and KeepAlive off (the worker MPM pins a thread to each keep-alive connection,
# so 16 threads would only ever serve 16 clients).
KeepAlive Off
ListenBacklog 1024
# Same as the gateway's response timeout (fhir-server.sh); the lower one applies.
Timeout 900
<IfModule mpm_worker_module>
    ServerLimit          1
    StartServers         1
    ThreadLimit         16
    ThreadsPerChild     16
    MaxRequestWorkers   16
    MinSpareThreads      1
    MaxSpareThreads     32
</IfModule>
