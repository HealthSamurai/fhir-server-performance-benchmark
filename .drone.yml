kind: pipeline
type: docker
name: benchmark
node:
  node: hz-cdr

trigger:
  event:
    exclude: [ promote ]

volumes:
- name: dockersock
  temp: {}
- name: build
  temp: {}
- name: perf-cache-image
  host:
    path: /tmp/perf-test-image-cache
- name: perf-cache-overlay
  host:
    path: /tmp/perf-test-overlay-cache
- name: search-dataset
  host:
    path: /var/data/storage/pgdata/perf-test-search

services:
- name: dind
  image: docker:dind
  privileged: true
  volumes:
  - name: dockersock
    path: /var/run
  - name: perf-cache-image
    path: /var/lib/docker/image
  - name: perf-cache-overlay
    path: /var/lib/docker/overlay2
  - name: search-dataset
    path: /var/lib/search-dataset
steps:
- name: dind-ready
  image: docker:dind
  volumes:
  - name: dockersock
    path: /var/run
  commands:
  # Wait for Docker daemon to be ready.
  - |
    echo "Waiting for Docker daemon to start..."
    n=0
    until [ $n -ge 30 ] || docker info >/dev/null 2>&1; do
      n=$((n+1))
      echo "Attempt $n: Docker daemon not ready, waiting..."
      sleep 2
    done
    if [ $n -ge 30 ]; then
      echo "Docker daemon failed to start after 60 seconds"
      exit 1
    fi
    echo "Docker daemon is ready"

- name: configure
  image: alpine:latest
  environment:
    LICENSE:
      from_secret: LICENSE
    VMAUTH:
      from_secret: VMAUTH
  volumes:
  - name: build
    path: /tmp/workspace
  commands:
  ## Setup RUNID
  - export RUNID=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
  - echo $RUNID > /tmp/workspace/run-id
  - |
    cat > docker-compose.override.yml << EOF
    services:
      postgres:
        volumes: !override
          - ./infra/postgres/init:/docker-entrypoint-initdb.d
          - ./infra/postgres/postgres.conf:/postgres.conf
      aidbox:
        environment:
          BOX_LICENSE: $LICENSE
      # Benchmark only octofhir + aidbox: keep the other servers out of
      # bootstrap and out of k6's startup dependencies.
      hapi:
        profiles: [ donotstart ]
      hapi-checker:
        profiles: [ donotstart ]
      medplum:
        profiles: [ donotstart ]
      redis:
        profiles: [ donotstart ]
      mssql:
        profiles: [ donotstart ]
      mssql-tune:
        profiles: [ donotstart ]
      mssql-exporter:
        profiles: [ donotstart ]
      microsoft:
        profiles: [ donotstart ]
      microsoft-checker:
        profiles: [ donotstart ]
      wso2:
        profiles: [ donotstart ]
      wso2-checker:
        profiles: [ donotstart ]
      intersystems:
        profiles: [ donotstart ]
      k6:
        depends_on: !override
          aidbox:
            condition: service_healthy
          octofhir:
            condition: service_healthy
    EOF
  - |
    cat << EOF >> infra/prometheus/config.yaml
    remote_write:
    - url: https://vm.cdr.aidbox.dev/api/v1/write
      basic_auth:
        username: vm
        password: $VMAUTH
      follow_redirects: true
      write_relabel_configs:
      - target_label: commit
        replacement: "$DRONE_COMMIT"
      - target_label: branch
        replacement: "$DRONE_BRANCH"
      - target_label: commit_sha
        replacement: "$DRONE_COMMIT_SHA"
      - target_label: build_number
        replacement: "$DRONE_BUILD_NUMBER"
      - target_label: repo
        replacement: "$DRONE_REPO_NAME"
      - target_label: runid
        replacement: "$RUNID"
    EOF

- name: test
  image: docker.io/healthsamurai/perftest-runner:6
  depends_on:
  - configure
  - dind-ready
  privileged: true
  environment:
    SERVERS: octofhir aidbox
    DRONE_CI_GCP_SA:
      from_secret: DRONE_CI_GCP_SA
  volumes:
  - name: dockersock
    path: /var/run
  - name: build
    path: /tmp/workspace
  - name: search-dataset
    path: /var/lib/search-dataset
  commands:
  ## Setup RUNID
  - export RUNID=$(cat /tmp/workspace/run-id)

  ## GCP auth
  - printf "%s" "$DRONE_CI_GCP_SA" > /tmp/key.json
  - gcloud auth activate-service-account --key-file=/tmp/key.json
  - ls -la /google-cloud-sdk/bin/docker-credential-gcloud || echo "docker-credential-gcloud not found in gcloud SDK"
  - which docker-credential-gcloud || echo "docker-credential-gcloud not in PATH"
  - export PATH="/google-cloud-sdk/bin:$PATH"
  - gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
  - rm /tmp/key.json

  ## Run infra for CRUD and Import tests
  - ./runner.sh bootstrap

  ## Tests
  - ./runner.sh -t /k6/prewarm.js
  - ./runner.sh -t /k6/crud.js
  - ./runner.sh -t /k6/import.js
    ## Force refresh PG stats
  - docker exec perf-postgres vacuumdb --analyze -j 50  -U postgres --all
    ## Same for InterSystems IRIS: SQL table statistics of the FHIR storage
  - docker exec perf-intersystems /opt/intersystems/gather-stats.sh
  - ./runner.sh -t /k6/search.js

  ## Record test end time (RUNID is the start time set in the configure step)
  - date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/workspace/end-time

  ## Cleanup
  - sleep 120
  - docker compose down -v

- name: snapshot
  environment:
    METRICS_URL: https://vm.cdr.aidbox.dev
    GRAFANA_URL: https://grafana.cdr.aidbox.dev
    METRICS_USERNAME: vm
    METRICS_PASSWORD:
      from_secret: VMAUTH
    GRAFANA_TOKEN:
      from_secret: GRAFANA_TOKEN
  image: node:24-alpine
  depends_on:
  - test
  volumes:
  - name: build
    path: /tmp/workspace
  commands:
  - export RUNID=$(cat /tmp/workspace/run-id)
  - export ENDTIME=$(cat /tmp/workspace/end-time)
  - node scripts/generate-snapshot.js -o /tmp/workspace/reports
  - node scripts/grafana-snapshot.js "$RUNID" --report "/tmp/workspace/reports/SNAPSHOT_$RUNID.json"

- name: upload-to-gcs
  environment:
    GOOGLE_APPLICATION_CREDENTIALS_JSON:
      from_secret: BUCKET_KEY
  image: google/cloud-sdk:alpine
  depends_on:
  - snapshot
  volumes:
  - name: build
    path: /tmp/workspace
  commands:
  - export RUNID=$(cat /tmp/workspace/run-id)
  - echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcs-key.json
  - gcloud auth activate-service-account --key-file=/tmp/gcs-key.json
  - |
    # Determine target path based on branch
    if [ "${DRONE_BRANCH}" = "main" ]; then
      TARGET_PATH="gs://samurai-public/fhir-server-performance-benchmark/"
    else
      TARGET_PATH="gs://samurai-public/fhir-server-performance-benchmark/${DRONE_BRANCH}/"
    fi
    echo "Uploading reports to: $TARGET_PATH"
    gsutil -m cp -r "/tmp/workspace/reports/SNAPSHOT_$RUNID.json" "$TARGET_PATH"
    gsutil -m cp -r "/tmp/workspace/reports/SOURCE_DATA_$RUNID.json" "$TARGET_PATH"
    echo "Reports uploaded to GCS bucket at $TARGET_PATH"
  - rm /tmp/gcs-key.json
