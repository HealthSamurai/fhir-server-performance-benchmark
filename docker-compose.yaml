name: perf

volumes:
  pgdata:
  promdata:
  tgzdata:
  mssqldata:

services:

## ------------------------------------------------
## Postgres 
## ------------------------------------------------
  postgres:
    container_name: perf-postgres
    image: postgres:18
    pull_policy: always
    command: postgres -c config_file=/postgres.conf
    ports:
      - "13020:5432"
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 30G
    environment:
      PGDATA: /data/pg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: pg_isready -U postgres
      interval: 3s
      start_period: 10s
    volumes:
      - pgdata:/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - ./infra/postgres/postgres.conf:/postgres.conf

## ------------------------------------------------
## FHIR Servers
## ------------------------------------------------

## ------------------------------------------------
## Aidbox 
## ------------------------------------------------
  aidbox:
    container_name: perf-aidbox
    image: us-east1-docker.pkg.dev/aidbox2-205511/aidbox/aidboxone:git-829a23677142cea9183288c23adca6524af9dc5c
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 24G
    volumes:
      - ./infra/aidbox/initbundle.json:/tmp/initbundle.json
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=80 -XshowSettings:vm"
      BOX_ADMIN_PASSWORD: secret
      BOX_CACHE_REPLICATION_DISABLE: true
      BOX_BOOTSTRAP_FHIR_PACKAGES: hl7.fhir.r4.core#4.0.1
      BOX_DB_DATABASE: aidbox
      BOX_DB_HOST: postgres
      BOX_DB_PASSWORD: postgres
      BOX_DB_USER: postgres
      BOX_WEB_THREAD: 16
      BOX_DB_POOL_MAXIMUM__POOL__SIZE: 32
      BOX_FHIR_COMPLIANT_MODE: true
      BOX_FHIR_CORRECT_AIDBOX_FORMAT: true
      BOX_FHIR_CREATEDAT_URL: https://aidbox.app/ex/createdAt
      BOX_FHIR_SCHEMA_VALIDATION: true
      BOX_FHIR_SEARCH_AUTHORIZE_INLINE_REQUESTS: true
      BOX_FHIR_SEARCH_COMPARISONS: true
      BOX_SEARCH_DATE_MULTIRANGE: true
      BOX_FHIR_TERMINOLOGY_SERVICE_BASE_URL: https://tx.health-samurai.io/fhir
      #BOX_FHIR_TERMINOLOGY_ENGINE: hybrid
      BOX_METRICS_PORT: 8379
      BOX_INIT_BUNDLE: file:///tmp/initbundle.json
      BOX_ROOT_CLIENT_SECRET: secret
      BOX_SEARCH_INCLUDE_CONFORMANT: true
      BOX_SECURITY_DEV_MODE: true
      BOX_SETTINGS_MODE: read-write
      BOX_WEB_BASE_URL: http://localhost:13080
      BOX_WEB_MAX_BODY: 209715200
      BOX_WEB_PORT: 8080
      BOX_FHIR_SEARCH_DEFAULT_PARAMS_TOTAL: none
    healthcheck:
      test: curl -f http://localhost:8080/health
      interval: 30s
      start_period: 30s
      retries: 10
    ports:
      - "13080:8080"

## ------------------------------------------------
## HAPI FHIR
## ------------------------------------------------
  hapi:
    container_name: perf-hapi
    image: hapiproject/hapi:latest
    pull_policy: always
    entrypoint:
      - java
      - -XX:MaxRAMPercentage=80
      - -XshowSettings:vm
      - --class-path
      - /app/main.war
      - -Dloader.path=main.war!/WEB-INF/classes/,main.war!/WEB-INF/,/app/extra-classes
      - org.springframework.boot.loader.PropertiesLauncher
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 24G
    ports:
      - "13090:8080"
    volumes:
      - ./infra/hapi/application.yaml:/app/config/application.yaml:ro

  hapi-checker:
    container_name: perf-hapi-hc
    image: curlimages/curl
    command: ["-c", "trap : TERM INT; sleep infinity & wait"]
    depends_on:
      hapi:
        condition: service_started
    entrypoint: /bin/sh
    healthcheck:
      test: curl -f http://hapi:8080/actuator/health/readiness
      interval: 10s
      start_period: 30s
      retries: 10

## ------------------------------------------------
## Medplum 
## ------------------------------------------------
  medplum:
    image: medplum/medplum-server:latest
    pull_policy: always
    command:
      - file:/srv/config.json
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: '1'
          memory: 3G
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    volumes:
      - ./infra/medplum:/srv
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
        ]
      interval: 10s
      timeout: 1s
      retries: 10

  redis:
    container_name: perf-redis
    image: redis:latest
    pull_policy: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 5

## ------------------------------------------------
## Microsoft FHIR Server (.NET) + SQL Server datastore
## ------------------------------------------------
## The Microsoft FHIR server only supports SQL Server / Cosmos DB (no Postgres),
## so it gets its own dedicated SQL Server — analogous to the shared Postgres the
## other servers use. Tests run sequentially, so only one app+DB pair is active
## at a time; the SQL Server therefore mirrors Postgres' budget (8 cpu / 30G) and
## the FHIR app mirrors aidbox/hapi (8 cpu / 24G) to keep the comparison fair.
  mssql:
    container_name: perf-mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 30G
    environment:
      ACCEPT_EULA: "Y"
      # Developer edition = full Enterprise feature set, no Express resource caps
      # (Express would cap the buffer pool at ~1.4G and cores, skewing the bench).
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Fhir_Perf_2026!"
      # SQL max server memory, kept under the 30G container limit (headroom for
      # the thread stacks / CLR / non-buffer-pool allocations outside this cap).
      MSSQL_MEMORY_LIMIT_MB: "26000"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' -b"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 12

  # One-shot tuner (analogous to infra/postgres/postgres.conf, which Postgres
  # loads at boot). SQL Server can't take MAXDOP / cost-threshold / tempdb layout
  # from env vars, so apply them via T-SQL once SQL is healthy, then exit. Reuses
  # the server image purely because it already ships sqlcmd (no extra pull).
  mssql-tune:
    container_name: perf-mssql-tune
    image: mcr.microsoft.com/mssql/server:2022-latest
    pull_policy: always
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Fhir_Perf_2026!"
    volumes:
      - ./infra/mssql/tune.sql:/tune.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - '/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -No -i /tune.sql -b'

  microsoft:
    container_name: perf-microsoft
    image: mcr.microsoft.com/healthcareapis/r4-fhir-server:latest
    pull_policy: always
    # First boot creates the FHIR schema before SQL is fully warmed; restart on the
    # occasional startup race instead of failing the whole bootstrap.
    restart: on-failure
    depends_on:
      mssql:
        condition: service_healthy
      # Wait for tuning so the schema/index build also honours MAXDOP = 4.
      mssql-tune:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 24G
    environment:
      DataStore: "SqlServer"
      # Auth disabled to match the other servers (the k6 tests hit FHIR unauthenticated).
      FHIRServer__Security__Enabled: "false"
      # Raise the transaction-bundle entry cap (FhirServer:Bundle:EntryLimit,
      # default 500). The Synthea import bundles run up to ~2.6k entries each;
      # aidbox/hapi/medplum impose no such cap, so without this MS FHIR 400s every
      # import. 100k = effectively unlimited for this dataset, keeping it fair.
      FHIRServer__Bundle__EntryLimit: "100000"
      # Max Pool Size=32 matches aidbox (32) and HAPI's HikariCP (32); ADO.NET
      # would otherwise default to 100, giving MS FHIR an unfair connection budget.
      SqlServer__ConnectionString: "Server=tcp:mssql,1433;Initial Catalog=FHIR;Persist Security Info=False;User ID=sa;Password=Fhir_Perf_2026!;MultipleActiveResultSets=False;Connection Timeout=30;TrustServerCertificate=true;Max Pool Size=32;Min Pool Size=4;"
      SqlServer__AllowDatabaseCreation: "true"
      SqlServer__Initialize: "true"
      SqlServer__SchemaOptions__AutomaticUpdatesEnabled: "true"
    ports:
      - "13100:8080"

  # Sidecar healthcheck (mirrors hapi-checker): the .NET runtime image has no curl,
  # so probe /health/check from a curl container instead.
  microsoft-checker:
    container_name: perf-microsoft-hc
    image: curlimages/curl
    command: ["-c", "trap : TERM INT; sleep infinity & wait"]
    depends_on:
      microsoft:
        condition: service_started
    entrypoint: /bin/sh
    healthcheck:
      test: curl -f http://microsoft:8080/health/check
      interval: 10s
      start_period: 40s
      retries: 30

  # Prometheus exporter for SQL Server internals (DB size, transactions, page
  # life expectancy, connections, I/O stalls) — the MSSQL counterpart to
  # postgres-exporter, so the Microsoft FHIR datastore is visible in Grafana
  # alongside the Postgres-backed servers. Scraped by Prometheus on :4000.
  mssql-exporter:
    container_name: perf-mssql-exporter
    image: awaragi/prometheus-mssql-exporter:latest
    pull_policy: always
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SERVER: mssql
      PORT: "1433"
      USERNAME: sa
      PASSWORD: "Fhir_Perf_2026!"
      ENCRYPT: "true"
      TRUST_SERVER_CERTIFICATE: "true"
      EXPOSE: "4000"

## ------------------------------------------------
## K6 test runner and tgz service fo import tests
## ------------------------------------------------
  k6:
    container_name: perf-k6
    image: grafana/k6
    pull_policy: always
    depends_on:
      aidbox:
        condition: service_healthy
      medplum:
        condition: service_healthy
      hapi-checker:
        condition: service_healthy
      microsoft-checker:
        condition: service_healthy
    profiles:
      - donotstart
    volumes:
      - ./k6:/k6
      - ./runner.sh:/runner.sh:ro

  tgz:
    container_name: perf-tgz
    build:
      context: infra/tgz
    command:
      - "https://storage.googleapis.com/aidbox-public/synthea/performance/bulk_1k.tar.gz"
    volumes:
      - tgzdata:/data
    working_dir: /data

## ------------------------------------------------
## Monitoring stack
## ------------------------------------------------
  prometheus:
    container_name: perf-prometheus
    image: prom/prometheus
    pull_policy: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=native-histograms
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    healthcheck:
      test: wget -O - http://localhost:9090/-/ready
      interval: 5s
      start_period: 5s
    ports:
      - "13010:9090"
    volumes:
      - promdata:/prometheus
      - ./infra/prometheus/config.yaml:/etc/prometheus/prometheus.yml

  grafana:
    container_name: perf-grafana
    image: grafana/grafana:13.0
    pull_policy: always
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_BASIC_ENABLED: true
      GF_SECURITY_ADMIN_PASSWORD: admin
      
    healthcheck:
      test: curl http://localhost:3000/api/health
      interval: 5s
      start_period: 30s
    ports:
      - "13000:3000"
    volumes:
      - ./infra/grafana:/etc/grafana/provisioning:ro

  cadvisor:
    container_name: perf-cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    pull_policy: always
    privileged: true
    command:
      - --containerd=/var/run/docker/containerd/containerd.sock
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  otel-collector:
    container_name: perf-otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    pull_policy: always
    command:
      - --config=/etc/otel/config.yaml
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro

  postgres-exporter:
    container_name: perf-postgres-exporter
    image: quay.io/prometheuscommunity/postgres-exporter
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_PASS: postgres
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
    healthcheck:
      test: wget -O - http://localhost:9187/metrics
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 3