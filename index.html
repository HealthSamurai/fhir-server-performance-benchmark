<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FHIR Server Performance Reports Index</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="px-6 py-5 bg-white flex justify-between items-center">
        <h2 class="text-xl font-semibold text-gray-900">FHIR Server Performance Reports</h2>
      </div>
      <div class="px-6 pb-6">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Run ID</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Start</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">End</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Snapshot</th>
            </tr>
          </thead>
          <tbody id="runs-table" class="bg-white divide-y divide-gray-200">
            <!-- Rows will be inserted here by JS -->
          </tbody>
        </table>
      </div>
    </div>
    <div class="mt-2 text-center text-sm text-gray-500">
      <p>Note: The snapshot can be imported into any Grafana instance.</p>
    </div>
  </div>
  <script>
    // Helper to format epoch seconds to local date string
    function formatDate(epoch) {
      if (!epoch) return '-';
      const d = new Date(epoch * 1000);
      return d.toLocaleString();
    }
    // Fetch runids.json and populate the table
    fetch('runids.json')
      .then(res => res.json())
      .then(data => {
        const table = document.getElementById('runs-table');
        if (!Array.isArray(data) || data.length === 0) {
          table.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-400">No runs found.</td></tr>';
          return;
        }
        data.forEach(run => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
              <a href="./reports/${run.runid}.html" class="text-blue-600 hover:underline font-medium">${run.runid}</a>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(run.start)}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(run.end)}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
              <a href="./snapshots/${run.runid}.json" class="text-blue-600 hover:text-blue-800" download title="Download Grafana Snapshot">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
              </a>
            </td>
          `;
          table.appendChild(tr);
        });
      })
      .catch(() => {
        document.getElementById('runs-table').innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-400">Failed to load runids.json</td></tr>';
      });
  </script>
</body>
</html>
